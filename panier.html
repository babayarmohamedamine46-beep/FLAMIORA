<script>
  function renderCartLine(line) {
    const product = getProductById(line.id);
    if (!product) return '';
    const name = localized(product, 'name');
    return `<div class="cart-line" data-line="${product.id}">
      <a class="thumb" href="produit.html?slug=${product.slug}"><img src="${product.image}" alt="${name}"></a>
      <div class="info">
        <a class="name" href="produit.html?slug=${product.slug}">${name}</a>
        <span class="unit-price">${formatPrice(product.price)}</span>
        <div class="line-actions">
          <div class="qty-stepper">
            <button type="button" data-minus="${product.id}" aria-label="-">−</button>
            <input type="number" min="1" max="${product.stock}" value="${line.qty}" data-qty="${product.id}">
            <button type="button" data-plus="${product.id}" aria-label="+">+</button>
          </div>
          <button type="button" class="remove-btn" data-remove="${product.id}">${t('cart.remove')}</button>
        </div>
      </div>
      <div class="line-total">${formatPrice(product.price * line.qty)}</div>
    </div>`;
  }

  function renderCartPage() {
    const lines = getCart();

    if (lines.length === 0) {
      document.getElementById('cart-empty').hidden = false;
      document.getElementById('cart-layout').hidden = true;
      return;
    }

    document.getElementById('cart-empty').hidden = true;
    document.getElementById('cart-layout').hidden = false;

    document.getElementById('cart-lines').innerHTML = lines.map(renderCartLine).join('');

    const subtotal = cartSubtotal();
    document.getElementById('summary-subtotal').textContent = formatPrice(subtotal);
    document.getElementById('summary-total').textContent = formatPrice(subtotal);

    document.querySelectorAll('[data-remove]').forEach((btn) => {
      btn.addEventListener('click', () => { removeFromCart(btn.dataset.remove); renderCartPage(); });
    });
    document.querySelectorAll('[data-minus]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const line = getCart().find((l) => l.id === btn.dataset.minus);
        if (line) { updateCartQty(btn.dataset.minus, line.qty - 1 <= 0 ? 1 : line.qty - 1); renderCartPage(); }
      });
    });
    document.querySelectorAll('[data-plus]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const line = getCart().find((l) => l.id === btn.dataset.plus);
        if (line) { updateCartQty(btn.dataset.plus, line.qty + 1); renderCartPage(); }
      });
    });
    document.querySelectorAll('[data-qty]').forEach((input) => {
      input.addEventListener('change', () => {
        const val = parseInt(input.value, 10) || 1;
        updateCartQty(input.dataset.qty, val);
        renderCartPage();
      });
    });
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    renderCartPage();
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(renderCartPage, 0));
    });
  });
</script>
