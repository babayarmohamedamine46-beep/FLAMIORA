<script>
  function renderProductCard(p) {
    const compareHtml = p.compare_at ? `<span class="old">${formatPrice(p.compare_at)}</span>` : '';
    const disabled = p.stock <= 0 ? 'disabled' : '';
    const newBadge = p.compare_at ? '' : (p.featured ? `<span class="new-badge">${getLocale() === 'ar' ? 'جديد' : 'Nouveau'}</span>` : '');
    return `<div class="product-card">
      ${newBadge}
      <button class="wish-btn" data-wish="${p.id}" aria-label="Wishlist"></button>
      <a class="thumb" href="produit.html?slug=${p.slug}"><img src="${p.image}" alt="${localized(p, 'name')}" loading="lazy"></a>
      <div class="body">
        ${stockBadge(p)}
        <a href="produit.html?slug=${p.slug}" class="name">${localized(p, 'name')}</a>
        <div class="price">${compareHtml}${formatPrice(p.price)}</div>
        <button class="btn btn-primary add-btn" data-add="${p.id}" ${disabled}>${t('product.addToCart')}</button>
      </div>
    </div>`;
  }

  function currentCategory() {
    return new URLSearchParams(window.location.search).get('cat') || '';
  }

  function currentQuery() {
    return new URLSearchParams(window.location.search).get('q') || '';
  }

  function renderFilters() {
    const active = currentCategory();
    const chips = [`<button class="filter-chip ${active === '' ? 'active' : ''}" data-cat="">${t('products.all')}</button>`]
      .concat(window.CATEGORIES.map((c) => `<button class="filter-chip ${active === c.id ? 'active' : ''}" data-cat="${c.id}">${localized(c, 'name')}</button>`));
    document.getElementById('filters-bar').innerHTML = chips.join('');

    document.querySelectorAll('[data-cat]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        const url = cat ? `produits.html?cat=${cat}` : 'produits.html';
        window.history.pushState({}, '', url);
        renderFilters();
        renderProducts();
      });
    });
  }

  function renderSearchBanner(query) {
    const banner = document.getElementById('search-banner');
    if (!query) { banner.hidden = true; return; }
    banner.hidden = false;
    const label = getLocale() === 'ar' ? `نتائج البحث عن: "${query}"` : `Résultats pour : "${query}"`;
    banner.querySelector('span').textContent = label;
    banner.querySelector('#clear-search').textContent = getLocale() === 'ar' ? 'إلغاء البحث' : 'Effacer';
  }

  function renderProducts() {
    const cat = currentCategory();
    const query = currentQuery();
    let list = cat ? window.PRODUCTS.filter((p) => p.category_id === cat) : window.PRODUCTS;
    if (query) list = searchProducts(query, 0).filter((p) => !cat || p.category_id === cat);
    renderSearchBanner(query);
    document.getElementById('products-grid').innerHTML = list.map(renderProductCard).join('');
    document.getElementById('empty-msg').hidden = list.length > 0;
    wireAddButtons();
    wireWishlistButtons();
  }

  function wireAddButtons() {
    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addToCart(btn.dataset.add, 1);
        btn.textContent = getLocale() === 'ar' ? 'أُضيف ✓' : 'Ajouté ✓';
        setTimeout(() => { btn.textContent = t('product.addToCart'); }, 1200);
      });
    });
  }

  function initProductsPage() {
    renderFilters();
    renderProducts();
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    initProductsPage();
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(initProductsPage, 0));
    });
  });
</script>
