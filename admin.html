<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | FLAMIORA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<div class="adm-login-screen" id="login-screen">
  <div class="adm-login-box">
    <h1 data-i18n="admin.login.title"></h1>
    <form id="login-form">
      <div class="adm-field">
        <label data-i18n="admin.login.email"></label>
        <input type="email" id="login-email" required>
      </div>
      <div class="adm-field">
        <label data-i18n="admin.login.password"></label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="adm-btn adm-btn-primary adm-btn-block" data-i18n="admin.login.submit"></button>
      <p class="adm-error" id="login-error"></p>
    </form>
  </div>
</div>

<div class="adm-shell" id="admin-shell">
  <aside class="adm-sidebar">
    <h2>FLAMIORA</h2>
    <a href="#" class="adm-nav-link active" data-view="products" data-i18n="admin.nav.products"></a>
    <a href="#" class="adm-nav-link" data-view="categories" data-i18n="admin.nav.categories"></a>
    <a href="#" class="adm-nav-link logout" id="logout-btn" data-i18n="admin.nav.logout"></a>
  </aside>

  <main class="adm-main">
    <section class="adm-view active" id="view-products">
      <div class="adm-head">
        <h1 data-i18n="admin.products.title"></h1>
        <button class="adm-btn adm-btn-primary" id="add-product-btn" data-i18n="admin.products.add"></button>
      </div>
      <table class="adm-table">
        <thead>
          <tr>
            <th></th>
            <th data-i18n="admin.form.nameFr"></th>
            <th data-i18n="admin.form.category"></th>
            <th data-i18n="admin.form.price"></th>
            <th data-i18n="admin.form.stock"></th>
            <th data-i18n="admin.form.active"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </section>

    <section class="adm-view" id="view-categories">
      <div class="adm-head">
        <h1 data-i18n="admin.categories.title"></h1>
        <button class="adm-btn adm-btn-primary" id="add-category-btn" data-i18n="admin.categories.add"></button>
      </div>
      <table class="adm-table">
        <thead>
          <tr>
            <th></th>
            <th data-i18n="admin.form.nameFr"></th>
            <th data-i18n="admin.form.displayOrder"></th>
            <th data-i18n="admin.form.active"></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="categories-tbody"></tbody>
      </table>
    </section>
  </main>
</div>

<div class="adm-modal-backdrop" id="product-modal">
  <div class="adm-modal">
    <h2 id="product-modal-title"></h2>
    <form id="product-form">
      <input type="hidden" id="product-id">
      <div class="adm-form-grid">
        <div class="adm-field"><label data-i18n="admin.form.nameAr"></label><input type="text" id="p-name-ar" required></div>
        <div class="adm-field"><label data-i18n="admin.form.nameFr"></label><input type="text" id="p-name-fr" required></div>
        <div class="adm-field"><label data-i18n="admin.form.shortAr"></label><input type="text" id="p-short-ar"></div>
        <div class="adm-field"><label data-i18n="admin.form.shortFr"></label><input type="text" id="p-short-fr"></div>
        <div class="adm-field full"><label data-i18n="admin.form.descAr"></label><textarea id="p-desc-ar"></textarea></div>
        <div class="adm-field full"><label data-i18n="admin.form.descFr"></label><textarea id="p-desc-fr"></textarea></div>
        <div class="adm-field"><label data-i18n="admin.form.price"></label><input type="number" id="p-price" min="0" step="0.01" required></div>
        <div class="adm-field"><label data-i18n="admin.form.compareAt"></label><input type="number" id="p-compare-at" min="0" step="0.01"></div>
        <div class="adm-field"><label data-i18n="admin.form.category"></label><select id="p-category" required></select></div>
        <div class="adm-field"><label data-i18n="admin.form.stock"></label><input type="number" id="p-stock" min="0" required></div>
        <div class="adm-field full"><label data-i18n="admin.form.image"></label><input type="text" id="p-image" required></div>
        <div class="adm-field"><label data-i18n="admin.form.slug"></label><input type="text" id="p-slug" required></div>
        <div class="adm-field"><label data-i18n="admin.form.displayOrder"></label><input type="number" id="p-display-order" min="0" required></div>
        <div class="adm-checkbox-row"><input type="checkbox" id="p-featured"><label data-i18n="admin.form.featured"></label></div>
        <div class="adm-checkbox-row"><input type="checkbox" id="p-active" checked><label data-i18n="admin.form.active"></label></div>
      </div>
      <div class="adm-modal-actions">
        <button type="button" class="adm-btn adm-btn-outline" data-close-modal="product-modal" data-i18n="admin.form.cancel"></button>
        <button type="submit" class="adm-btn adm-btn-primary" data-i18n="admin.form.save"></button>
      </div>
    </form>
  </div>
</div>

<div class="adm-modal-backdrop" id="category-modal">
  <div class="adm-modal">
    <h2 id="category-modal-title"></h2>
    <form id="category-form">
      <input type="hidden" id="category-id">
      <div class="adm-form-grid">
        <div class="adm-field"><label data-i18n="admin.form.nameAr"></label><input type="text" id="c-name-ar" required></div>
        <div class="adm-field"><label data-i18n="admin.form.nameFr"></label><input type="text" id="c-name-fr" required></div>
        <div class="adm-field full"><label data-i18n="admin.form.image"></label><input type="text" id="c-image" required></div>
        <div class="adm-field"><label data-i18n="admin.form.slug"></label><input type="text" id="c-slug" required></div>
        <div class="adm-field"><label data-i18n="admin.form.displayOrder"></label><input type="number" id="c-display-order" min="0" required></div>
        <div class="adm-checkbox-row"><input type="checkbox" id="c-active" checked><label data-i18n="admin.form.active"></label></div>
      </div>
      <div class="adm-modal-actions">
        <button type="button" class="adm-btn adm-btn-outline" data-close-modal="category-modal" data-i18n="admin.form.cancel"></button>
        <button type="submit" class="adm-btn adm-btn-primary" data-i18n="admin.form.save"></button>
      </div>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
