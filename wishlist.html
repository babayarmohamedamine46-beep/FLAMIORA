<script>
  function renderWishCard(p) {
    const compareHtml = p.compare_at ? `<span class="old">${formatPrice(p.compare_at)}</span>` : '';
    const disabled = p.stock <= 0 ? 'disabled' : '';
    return `<div class="product-card">
      <button class="wish-btn is-active" data-wish="${p.id}" aria-label="Wishlist"></button>
      <a class="thumb" href="produit.html?slug=${p.slug}"><img src="${p.image}" alt="${localized(p, 'name')}" loading="lazy"></a>
      <div class="body">
        ${stockBadge(p)}
        <a href="produit.html?slug=${p.slug}" class="name">${localized(p, 'name')}</a>
        <div class="price">${compareHtml}${formatPrice(p.price)}</div>
        <button class="btn btn-primary add-btn" data-add="${p.id}" ${disabled}>${t('wishlist.addToCart')}</button>
      </div>
    </div>`;
  }

  function renderWishlistPage() {
    const ids = getWishlist();
    const products = ids.map(getProductById).filter(Boolean);
    document.getElementById('wish-empty').hidden = products.length > 0;
    document.getElementById('wish-grid').hidden = products.length === 0;
    document.getElementById('wish-grid').innerHTML = products.map(renderWishCard).join('');

    wireWishlistButtons();
    document.querySelectorAll('[data-wish]').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(renderWishlistPage, 0));
    });
    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addToCart(btn.dataset.add, 1);
        btn.textContent = getLocale() === 'ar' ? 'أُضيف ✓' : 'Ajouté ✓';
        setTimeout(() => { btn.textContent = t('wishlist.addToCart'); }, 1200);
      });
    });
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    renderWishlistPage();
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(renderWishlistPage, 0));
    });
  });
</script>
