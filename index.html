<script>
  function renderCategoryCard(cat) {
    return `<a class="category-card" href="produits.html?cat=${cat.id}">
      <img src="${cat.image}" alt="${localized(cat, 'name')}" loading="lazy">
      <div class="label">${localized(cat, 'name')}</div>
    </a>`;
  }

  function renderProductCard(p) {
    const compareHtml = p.compare_at ? `<span class="old">${formatPrice(p.compare_at)}</span>` : '';
    const disabled = p.stock <= 0 ? 'disabled' : '';
    return `<div class="product-card">
      <a class="thumb" href="produit.html?slug=${p.slug}"><img src="${p.image}" alt="${localized(p, 'name')}" loading="lazy"></a>
      <div class="body">
        ${stockBadge(p)}
        <a href="produit.html?slug=${p.slug}" class="name">${localized(p, 'name')}</a>
        <div class="price">${compareHtml}${formatPrice(p.price)}</div>
        <button class="btn btn-primary add-btn" data-add="${p.id}" ${disabled}>${t('product.addToCart')}</button>
      </div>
    </div>`;
  }

  function initHome() {
    document.getElementById('category-grid').innerHTML = window.CATEGORIES.map(renderCategoryCard).join('');
    document.getElementById('featured-grid').innerHTML = window.PRODUCTS.filter((p) => p.featured).slice(0, 4).map(renderProductCard).join('');

    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addToCart(btn.dataset.add, 1);
        btn.textContent = getLocale() === 'ar' ? 'أُضيف ✓' : 'Ajouté ✓';
        setTimeout(() => { btn.textContent = t('product.addToCart'); }, 1200);
      });
    });

    const reviews = getLocale() === 'ar'
      ? ['جودة رائعة وتغليف أنيق، وصل الطلب بسرعة!', 'خاتم جميل جدًا يستحق الثمن.', 'تعامل راقٍ وتوصيل سريع لمدينتي.']
      : ["Qualité superbe et emballage élégant, livraison rapide !", "Une très belle bague, ça valait le prix.", "Service impeccable et livraison rapide dans ma ville."];
    document.getElementById('review1').textContent = `"${reviews[0]}"`;
    document.getElementById('review2').textContent = `"${reviews[1]}"`;
    document.getElementById('review3').textContent = `"${reviews[2]}"`;
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    initHome();
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(initHome, 0));
    });
  });
</script>
