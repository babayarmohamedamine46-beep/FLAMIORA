<script>
  function renderProductCard(p) {
    const compareHtml = p.compare_at ? `<span class="old">${formatPrice(p.compare_at)}</span>` : '';
    const disabled = p.stock <= 0 ? 'disabled' : '';
    const newBadge = p.compare_at ? '' : (p.featured ? `<span class="new-badge">${getLocale() === 'ar' ? 'جديد' : 'Nouveau'}</span>` : '');
    return `<div class="product-card">
      ${newBadge}
      <button class="wish-btn" data-wish="${p.id}" aria-label="Wishlist"></button>
      <a class="thumb" href="produit.html?slug=${p.slug}"><img src="${p.image}" alt="${localized(p, 'name')}" loading="lazy"></a>
      <div class="body">
        ${stockBadge(p)}
        <a href="produit.html?slug=${p.slug}" class="name">${localized(p, 'name')}</a>
        <div class="price">${compareHtml}${formatPrice(p.price)}</div>
        <button class="btn btn-primary add-btn" data-add="${p.id}" ${disabled}>${t('product.addToCart')}</button>
      </div>
    </div>`;
  }

  function currentSlug() {
    return new URLSearchParams(window.location.search).get('slug') || '';
  }

  function initProductPage() {
    const product = getProductBySlug(currentSlug());

    if (!product) {
      document.getElementById('not-found').hidden = false;
      document.getElementById('product-view').hidden = true;
      return;
    }

    document.getElementById('not-found').hidden = true;
    document.getElementById('product-view').hidden = false;

    const category = getCategoryById(product.category_id);
    const name = localized(product, 'name');
    const short = localized(product, 'short');
    const desc = localized(product, 'desc');

    document.getElementById('page-title').textContent = `${name} | FLAMIORA`;
    document.getElementById('page-description').setAttribute('content', short);
    document.getElementById('page-canonical').setAttribute('href', `https://flamiora-f0062.web.app/produit.html?slug=${product.slug}`);
    document.getElementById('og-title').setAttribute('content', `${name} | FLAMIORA`);
    document.getElementById('og-description').setAttribute('content', short);
    document.getElementById('og-image').setAttribute('content', `https://flamiora-f0062.web.app/${product.image}`);
    document.getElementById('og-url').setAttribute('content', `https://flamiora-f0062.web.app/produit.html?slug=${product.slug}`);

    document.getElementById('crumb-category').textContent = category ? localized(category, 'name') : '';
    document.getElementById('crumb-category').href = category ? `produits.html?cat=${category.id}` : 'produits.html';
    document.getElementById('crumb-product').textContent = name;

    document.getElementById('product-image').src = product.image;
    document.getElementById('product-image').alt = name;
    document.getElementById('product-name').textContent = name;
    document.getElementById('product-short').textContent = short;
    document.getElementById('product-price').textContent = formatPrice(product.price);

    const compareEl = document.getElementById('product-compare');
    if (product.compare_at) {
      compareEl.textContent = formatPrice(product.compare_at);
      compareEl.hidden = false;
    } else {
      compareEl.hidden = true;
    }

    document.getElementById('product-stock').innerHTML = stockBadge(product);

    const wishBtn = document.getElementById('product-wish-btn');
    wishBtn.dataset.wish = product.id;
    wishBtn.dataset.wired = '';
    wireWishlistButtons();

    const inquiryMsg = getLocale() === 'ar'
      ? `مرحبًا FLAMIORA، أريد الاستفسار عن هذا المنتج: ${name}`
      : `Bonjour FLAMIORA, je souhaite avoir des informations sur ce produit : ${name}`;
    document.getElementById('product-whatsapp-btn').href = buildWhatsAppUrl(inquiryMsg);
    document.getElementById('product-description').textContent = desc;

    const qtyInput = document.getElementById('qty-input');
    qtyInput.max = product.stock;
    qtyInput.value = product.stock > 0 ? 1 : 0;

    const addBtn = document.getElementById('add-to-cart-btn');
    if (product.stock <= 0) {
      addBtn.setAttribute('disabled', 'disabled');
      addBtn.textContent = t('product.outOfStock');
    } else {
      addBtn.removeAttribute('disabled');
      addBtn.textContent = t('product.addToCart');
      addBtn.onclick = () => {
        const qty = Math.max(1, Math.min(parseInt(qtyInput.value, 10) || 1, product.stock));
        addToCart(product.id, qty);
        addBtn.textContent = getLocale() === 'ar' ? 'أُضيف إلى السلة ✓' : 'Ajouté au panier ✓';
        setTimeout(() => { addBtn.textContent = t('product.addToCart'); }, 1400);
      };
    }

    document.getElementById('qty-minus').onclick = () => {
      qtyInput.value = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1);
    };
    document.getElementById('qty-plus').onclick = () => {
      qtyInput.value = Math.min(product.stock, (parseInt(qtyInput.value, 10) || 1) + 1);
    };

    const similar = window.PRODUCTS.filter((p) => p.category_id === product.category_id && p.id !== product.id).slice(0, 4);
    document.getElementById('similar-grid').innerHTML = similar.map(renderProductCard).join('');
    wireWishlistButtons();
    document.querySelectorAll('#similar-grid [data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addToCart(btn.dataset.add, 1);
        btn.textContent = getLocale() === 'ar' ? 'أُضيف ✓' : 'Ajouté ✓';
        setTimeout(() => { btn.textContent = t('product.addToCart'); }, 1200);
      });
    });
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    initProductPage();
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(initProductPage, 0));
    });
  });
</script>
