<script>
  function initAboutPage() {
    const isAr = getLocale() === 'ar';
    document.getElementById('about-title').textContent = isAr ? 'قصة FLAMIORA' : "L'histoire de FLAMIORA";
    document.getElementById('about-p1').textContent = isAr
      ? 'وُلدت FLAMIORA من شغف بالتفاصيل الدقيقة والجمال الخالد. نختار كل قطعة بعناية لتعكس أناقة المرأة المغربية العصرية.'
      : "FLAMIORA est née d'une passion pour les détails délicats et la beauté intemporelle. Chaque pièce est choisie avec soin pour refléter l'élégance de la femme marocaine moderne.";
    document.getElementById('about-p2').textContent = isAr
      ? 'نلتزم بجودة عالية وخدمة راقية، مع توصيل سريع لجميع المدن المغربية ودفع آمن عند الاستلام.'
      : "Nous nous engageons pour une qualité irréprochable et un service soigné, avec une livraison rapide dans tout le Maroc et un paiement sécurisé à la livraison.";
  }
  document.addEventListener('DOMContentLoaded', initAboutPage);
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(initAboutPage, 0));
    });
  });
</script>
